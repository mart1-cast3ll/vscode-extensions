<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{csp}} https: data:; style-src {{csp}} 'unsafe-inline'; font-src {{csp}}; script-src 'nonce-{{nonce}}' {{csp}};">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Live Editor</title>
<link rel="stylesheet" href="{{media}}/css/base.css">
<link rel="stylesheet" href="{{media}}/css/toolbar.css">
<link rel="stylesheet" href="{{media}}/css/layout.css">
<link rel="stylesheet" href="{{media}}/css/markdown.css">
<link rel="stylesheet" href="{{media}}/css/editing.css">
</head>
<body>

<div class="top" id="toolbar" role="toolbar" aria-label="Formatting">
  <div class="tools">
    <button class="ib tip-start" id="bUndo" data-tip="Undo · Ctrl+Z" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="ib tip-start" id="bRedo" data-tip="Redo · Ctrl+Y" aria-label="Redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="ib" id="bSave" data-tip="Save · Ctrl+S" aria-label="Save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8"/><rect x="7" y="13" width="10" height="8" rx="1"/></svg></button>
    <span class="sep"></span>
    <button class="ib" data-format="heading" data-tip="Heading (cycles H1 → H3)" aria-label="Heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16M18 4v16M6 12h12"/></svg></button>
    <button class="ib" data-format="bold" data-tip="Bold · Ctrl+B" aria-label="Bold"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z"/></svg></button>
    <button class="ib" data-format="italic" data-tip="Italic · Ctrl+I" aria-label="Italic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4h-9M14 20H5M15 4 9 20"/></svg></button>
    <button class="ib" data-format="strike" data-tip="Strikethrough · Ctrl+Shift+X" aria-label="Strikethrough"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4H9a3 3 0 0 0-2.8 4M14 12a4 4 0 0 1 0 8H6M4 12h16"/></svg></button>
    <button class="ib" data-format="code" data-tip="Inline code · Ctrl+E" aria-label="Inline code"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg></button>
    <button class="ib" data-format="link" data-tip="Link · Ctrl+K" aria-label="Link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
    <button class="ib" data-format="image" data-tip="Image" aria-label="Image"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button>
    <span class="sep"></span>
    <button class="ib" data-format="bullet" data-tip="Bulleted list" aria-label="Bulleted list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></button>
    <button class="ib" data-format="numbered" data-tip="Numbered list" aria-label="Numbered list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M4 4h1v5M3.5 9h3M6 20H3.5c0-1.5 2.5-2 2.5-3.5 0-.8-.6-1.5-1.5-1.5-.6 0-1 .3-1.2.7"/></svg></button>
    <button class="ib" data-format="task" data-tip="Task list" aria-label="Task list"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="1.5"/><path d="m4 17 2 2 4-4M14 7.5h7M14 17h7"/></svg></button>
    <button class="ib" data-format="quote" data-tip="Quote" aria-label="Quote"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h6v6H6l-2 4zM14 7h6v6h-4l-2 4z"/></svg></button>
    <span class="sep"></span>
    <button class="ib" data-format="codeblock" data-tip="Code block" aria-label="Code block"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m9 10-2 2 2 2M15 10l2 2-2 2"/></svg></button>
    <button class="ib" data-format="table" data-tip="Table" aria-label="Table"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg></button>
    <button class="ib" data-format="hr" data-tip="Divider" aria-label="Divider"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M8 6h8M8 18h8"/></svg></button>
  </div>
  <div class="doc-name" id="docName"></div>
  <div class="tools">
    <button class="ib tip-end" id="bSource" data-tip="Show Markdown source side by side" aria-label="Source" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M6 9h3M6 13h3M15 9h3M15 13h3"/></svg></button>
    <button class="ib tip-end" id="bOutline" data-tip="Outline" aria-label="Outline" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M8 12h12M8 18h12"/></svg></button>
    <button class="ib tip-end" id="bText" data-tip="Open in the text editor" aria-label="Open in the text editor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  </div>
</div>

<div class="workspace" id="workspace">
  <section class="source-pane" id="sourcePane" aria-label="Markdown source">
    <textarea id="source" spellcheck="false" aria-label="Markdown source"></textarea>
  </section>
  <div class="source-split" id="sourceSplit" role="separator" aria-label="Resize source pane"></div>
  <main class="view-wrap">
    <article class="markdown-body" id="view"></article>
  </main>
  <nav class="outline-pane" aria-label="Outline">
    <div class="side-h">Outline</div>
    <div class="outline" id="outline"></div>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" nonce="{{nonce}}" src="{{media}}/js/main.js"></script>
</body>
</html>
